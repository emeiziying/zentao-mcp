name: Isolated checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o /tmp/zentao-mcp ./cmd/app
      - run: python3 scripts/test-v1-contract.py /tmp/zentao-mcp
      - run: python3 scripts/test-login-v1.py
