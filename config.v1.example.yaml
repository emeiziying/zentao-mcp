# Run from repository root. Supply each user's token in the MCP `Token` header.
port: '127.0.0.1:9090'
enable_toon: false
telemetry:
  endpoint: ''
servers:
  - name: zentao
    schema_url: docs/zentao-v1-readonly.json
    base_url: https://zentao.example.com/zentao/api.php/v1
    allow:
      - methods: [GET]
        regex: '^/(user|products|tasks/[^/]+)$'
    block: []
